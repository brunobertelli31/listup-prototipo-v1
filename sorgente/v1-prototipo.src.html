<title>ListUp V1 prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: on desktop the app lives in a 393×852 phone beside a short guide; on a phone it fills the screen and the guide follows below. */
:root{
  /* page around the phone */
  --page-bg:#E6E0D8; --page-fg:#302E2C; --page-muted:#6F6A66; --page-line:#D3CCC3; --page-card:#F3EFE9;
  /* ListUp design system — taken from the Figma file ListUp-INTERNO */
  --surface:#FAF6F0; --card:#FAFAFA; --ink:#302E2C; --text:#0B0A0B; --muted:#7A7179; --muted-warm:#7A7471;
  --accent:#E8743B; --accent-press:#A25129; --accent-soft:#FBE6DB; --on-accent:#FEF9F6;
  --green:#3F7A34; --ok-bg:#E8F3E5; --ok-line:#F0F6EF; --ok-fg:#4A8040; --danger:#EF5454;
  --toggle:#F1ECE5; --rule:#E9E4DE; --outline:#D8D2CC; --disabled:#BDB8BC; --handle:#D9D4CF;
  --scrim:rgba(48,46,44,.42); --shadow:0 1px 4px rgba(0,0,0,.18);
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sb:59px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page-bg:#1C1A19;--page-fg:#EDE8E2;--page-muted:#A39C96;--page-line:#3A3633;--page-card:#262321;color-scheme:dark}}
:root[data-theme="dark"]{--page-bg:#1C1A19;--page-fg:#EDE8E2;--page-muted:#A39C96;--page-line:#3A3633;--page-card:#262321;color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--page-bg);color:var(--page-fg);font-family:var(--f-body);-webkit-font-smoothing:antialiased;margin:0;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}

/* ---------- page shell ---------- */
.shell{display:flex;gap:56px;justify-content:center;align-items:flex-start;padding:24px 16px}
.guide{width:300px;flex:none;padding-top:40px;display:flex;flex-direction:column;gap:22px}
.guide h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.guide .kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--page-muted);font-weight:600;margin:0 0 8px}
.guide p{margin:0;font-size:14px;line-height:1.5;color:var(--page-muted)}
.guide h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--page-muted);font-weight:600;margin:0 0 10px}
.guide ol,.guide ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.seg{display:flex;background:var(--page-card);border:1px solid var(--page-line);border-radius:999px;padding:3px}
.seg button{flex:1;padding:8px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--page-muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.reset{align-self:flex-start;font-size:13px;font-weight:600;color:var(--page-fg);border:1px solid var(--page-line);border-radius:999px;padding:7px 14px}

.stage{flex:none;position:relative}
.device{width:417px;padding:12px;border-radius:60px;background:#151312;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);transform-origin:top center}
.phone{position:relative;width:393px;height:852px;border-radius:48px;overflow:hidden;background:var(--surface);color:var(--ink);isolation:isolate}
.island{position:absolute;top:11px;left:50%;width:125px;height:37px;margin-left:-62.5px;background:#000;border-radius:20px;z-index:60;pointer-events:none}

/* status bar */
.status{position:absolute;inset:0 0 auto 0;height:var(--sb);z-index:55;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 52px;color:#fff;transition:color .2s}
.status.dark{color:var(--text)}
.status .time{font:600 17px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;letter-spacing:-.2px}
.status .icons{display:flex;gap:6px;align-items:center}
.status .bat{fill:#000}
.status.dark .bat{fill:#fff}

/* ---------- screens ---------- */
.stack{position:absolute;inset:0}
.screen{position:absolute;inset:0;background:var(--surface);overflow:hidden;will-change:transform}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.topbar{position:absolute;inset:0 0 auto 0;height:calc(var(--sb) + 9px);background:var(--surface);z-index:5;opacity:0;pointer-events:none;transition:opacity .18s;box-shadow:0 1px 0 var(--rule)}
.topbar.on{opacity:1}

/* hero + curve */
.hero{position:relative;height:350px;margin-top:-1px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.curvewrap{position:absolute;left:0;right:0;top:262.2px;bottom:-1px;overflow:hidden}
.curvewrap::after{content:"";position:absolute;left:0;right:0;top:68.8px;bottom:0;background:var(--surface)}
.curve{position:absolute;left:calc(50% - 278.78px);top:0;width:557.55px;height:137.62px;border-radius:50%;background:var(--surface)}
.actions{position:absolute;top:calc(var(--sb) + 16px);left:16px;right:16px;display:flex;justify-content:space-between;z-index:2}
.round{width:40px;height:40px;border-radius:999px;background:var(--card);display:grid;place-items:center;color:var(--text);box-shadow:var(--shadow)}
.round:active{transform:scale(.96)}
.content{position:relative;margin-top:-56.8px;display:flex;flex-direction:column;gap:16px;padding-bottom:120px}
.ttl{padding:0 16px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.ttl h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.4;color:var(--ink)}
.ttl p{margin:0;font-size:16px;line-height:1.4;color:var(--muted-warm)}

.author{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-top:-6px}
.author .who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--ink)}
.author img{width:24px;height:24px;border-radius:999px}
.btn{height:48px;border-radius:999px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.fill{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px rgba(232,116,59,.35)}
.btn.fill:active{background:var(--accent-press)}
.btn.outline{border:1.5px solid var(--outline);color:var(--muted);background:var(--card)}
.btn.outline-accent{border:1.5px solid var(--accent);color:var(--accent);background:transparent}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{height:40px;font-size:15px;padding:0 18px}
.btn.following{background:var(--accent-soft);color:var(--accent-press);box-shadow:none}

.filters{display:flex;gap:12px;padding:8px 16px;align-items:center}
.search{flex:1;min-width:0;height:48px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);border:1px solid #fff;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:400 16px/24px var(--f-body);color:var(--text);outline:none}
.search input::placeholder{color:var(--muted)}
.search .clear[hidden]{display:none}
.search .clear{width:28px;height:28px;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.icon-btn{width:48px;height:48px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);border:1px solid #fff;display:grid;place-items:center;color:var(--text);flex:none}

.cards{display:flex;flex-direction:column;gap:12px;padding:8px 16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 0;min-height:28px}
.sec-h .l{display:flex;align-items:baseline;gap:8px}
.sec-h h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2;color:var(--ink)}
.sec-h .n{font-size:14px;color:var(--muted-warm);font-variant-numeric:tabular-nums}
.sec-h .link{font-size:14px;font-weight:600;color:var(--accent);padding:4px 0 4px 8px}

.card{display:flex;align-items:center;gap:12px;padding:7px 11px 7px 7px;min-height:80px;background:var(--card);border:1px solid #fff;border-radius:12px;box-shadow:var(--shadow);text-align:left;width:100%}
.card .ph{width:64px;height:64px;border-radius:4px;object-fit:cover;flex:none;background:var(--toggle)}
.card .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.card .t{font-weight:700;font-size:16px;line-height:24px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:14px;line-height:20px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .more{width:36px;height:36px;margin-right:-6px;display:grid;place-items:center;color:var(--muted);border-radius:999px}
.card .save{width:36px;height:36px;margin-right:-6px;display:grid;place-items:center;color:var(--accent);border-radius:999px}
.card:active{background:#F4F2F0}

.toggle{height:52px;border-radius:12px;background:var(--toggle);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;width:100%;color:var(--ink)}
.toggle .l{display:flex;align-items:baseline;gap:8px}
.toggle b{font-weight:600;font-size:15px}
.toggle span{font-size:15px;color:var(--muted-warm)}
.toggle svg{color:var(--muted-warm);transition:transform .25s}
.toggle[aria-expanded="true"] svg{transform:rotate(180deg)}

.qlist{display:flex;flex-direction:column;gap:12px}
.qlist.tight{gap:0}
.qrow{display:flex;align-items:center;gap:12px;padding:0 4px 0 8px;height:56px;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.qrow.slim{height:56px}
.qrow .ph{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none}
.qrow .tx,.rrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qrow .t{font-weight:600;font-size:14px;line-height:17px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .s{font-size:12px;line-height:15px;color:var(--muted-warm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .ic{width:40px;height:40px;display:grid;place-items:center;color:#5D5854;border-radius:999px}
.qrow .ic.save{color:var(--accent)}
.qrow:active{background:rgba(0,0,0,.02)}

.empty{padding:18px 16px;border:1.5px dashed var(--outline);border-radius:12px;color:var(--muted-warm);font-size:14px;line-height:1.45;text-align:center}

.fab{position:absolute;right:33px;bottom:74px;width:64px;height:64px;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(162,81,41,.35),0 1px 3px rgba(0,0,0,.15);z-index:4}
.fab:active{background:var(--accent-press);transform:scale(.97)}

/* simple header screens */
.head{position:relative;height:calc(var(--sb) + 44px);padding-top:var(--sb);display:flex;align-items:center;justify-content:center}
.head .back{position:absolute;left:12px;bottom:0;width:44px;height:44px;display:grid;place-items:center;color:var(--text)}
.head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:32px;line-height:44px;color:var(--ink)}
.intro{margin:0;padding:16px 16px 12px;font-size:15px;line-height:1.4;color:var(--muted-warm)}
.pad{padding:0 16px}

/* riordina */
.rlist{display:flex;flex-direction:column;min-height:8px}
.rrow{display:flex;align-items:center;gap:12px;height:56px;padding:0 4px 0 8px;border-bottom:1px solid var(--rule);background:var(--surface);position:relative;touch-action:pan-y}
.rrow .ph{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none}
.rrow .t{font-weight:600;font-size:14px;line-height:17px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .s{font-size:12px;line-height:15px;color:var(--muted-warm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .mv{width:40px;height:40px;display:grid;place-items:center;border-radius:999px;color:var(--accent)}
.rrow .mv.up{color:var(--green)}
.rrow .mv.off{color:var(--disabled)}
.rrow .grip{width:40px;height:44px;display:grid;place-items:center;color:#B7B1AC;cursor:grab;touch-action:none}
.rrow.dragging{z-index:10;box-shadow:0 10px 24px rgba(48,46,44,.18);border-radius:12px;border-bottom-color:transparent;background:var(--card)}
.rrow.dragging .grip{cursor:grabbing}
.rsec{padding:20px 16px 6px}
.rsec:first-child{padding-top:4px}
.footer{position:absolute;inset:auto 0 0 0;height:114px;background:linear-gradient(to bottom,rgba(250,246,240,0),var(--surface) 24px);padding:16px 16px 0;z-index:3}
.footer .btn{width:100%}

/* item detail */
.ititle{margin:0;padding:0 16px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.4;color:var(--ink)}
.idesc{margin:0;padding:0 16px;font-size:16px;line-height:1.4;color:var(--ink)}
.imeta{margin:0;padding:0 16px;font-size:16px;line-height:1.4;color:var(--muted-warm)}
.imeta b{font-weight:700}

/* overlays */
.ov{position:absolute;inset:0;z-index:40;pointer-events:none}
.ov.on{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s ease-out}
.ov.on .scrim{opacity:1}
.sheet{position:absolute;left:16px;right:16px;bottom:48px;background:#F8F8F8;border-radius:16px;padding:8px 0 8px;transform:translateY(calc(100% + 60px));transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 8px 30px rgba(0,0,0,.12)}
.ov.on .sheet{transform:none}
.sheet .grab{width:64px;height:4px;border-radius:4px;background:var(--handle);margin:0 auto 22px}
.sheet h4{margin:0 0 16px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.3;color:var(--text);padding:0 16px}
.sheet .row{display:flex;align-items:center;justify-content:space-between;width:100%;height:48px;padding:0 20px 0 16px;font-size:16px;color:var(--text);text-align:left}
.sheet .row:active{background:rgba(0,0,0,.04)}
.sheet .row.red{color:var(--danger)}
.sheet .row svg{color:var(--muted-warm)}
.dialog{position:absolute;left:16px;right:16px;top:50%;background:#FAFAFA;border-radius:16px;padding:20px;transform:translateY(-50%) scale(.96);opacity:0;transition:opacity .2s ease-out,transform .2s ease-out;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.ov.on .dialog{opacity:1;transform:translateY(-50%)}
.dialog .x{position:absolute;top:14px;right:14px;width:36px;height:36px;display:grid;place-items:center;color:var(--text)}
.dialog h4{margin:0 40px 8px 0;font-weight:700;font-size:20px;line-height:1.35;color:var(--text)}
.dialog p{margin:0 0 24px;font-size:16px;line-height:1.4;color:var(--muted-warm)}
.dialog .btns{display:flex;gap:16px}
.dialog .btns .btn{flex:1;padding:0 8px}

/* bivio Top 10 / coda: pannello dal basso con due tessere alla pari */
.csheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 16px 30px;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.ov.on .csheet{transform:none}
.csheet .grab{width:44px;height:5px;border-radius:5px;background:var(--handle);margin:0 auto 18px}
.csheet .who{display:flex;align-items:center;gap:12px;margin:0 4px 18px}
.csheet .cth{width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none;position:relative;box-shadow:0 0 0 2px #fff,0 3px 10px rgba(0,0,0,.16)}
.csheet .cth img{width:100%;height:100%;object-fit:cover;display:block}
.csheet .cth .poster{position:absolute;inset:0;font-size:8px;padding:6px}
.csheet h4{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;color:var(--text)}
.csheet .who p{margin:3px 0 0;font-size:15px;line-height:1.35;color:var(--muted-warm)}
.ctiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative}
.ctile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--outline);border-radius:20px;padding:16px 14px 16px;min-height:156px;transition:transform .1s,border-color .15s}
.ctile:active{transform:scale(.98);border-color:var(--accent)}
.ctile .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.ctile.q .ico{background:var(--toggle);color:var(--ink)}
.ctile b{font-size:17px;line-height:1.2;color:var(--text)}
.ctile small{font-size:13.5px;line-height:1.35;color:var(--muted-warm)}
.cor{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:999px;background:var(--surface);border:1.5px solid var(--outline);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted-warm)}
.csheet .cancel{display:block;margin:16px auto 0;padding:10px 20px;font-weight:700;font-size:16px;color:var(--muted-warm)}

.toasts{position:absolute;left:0;right:0;top:calc(var(--sb) + 98px);z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border-radius:16px;padding:9px 14px 9px 10px;font-weight:600;font-size:15px;line-height:20px;color:var(--ink);pointer-events:auto;background:rgba(250,246,240,.68);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(255,255,255,.72);box-shadow:0 10px 28px -12px rgba(0,0,0,.38);animation:sin .25s ease-out}
.snacks{position:absolute;left:16px;right:16px;bottom:48px;z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast .d{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;flex:none}
.toast.ok .d{background:rgba(63,122,52,.14);color:var(--green)}
.toast.info .d{background:rgba(48,46,44,.08);color:var(--ink)}
.toast.err .d{background:rgba(217,60,60,.13);color:#D93C3C}
.toast .tx{flex:1;min-width:0}
.toast button{font-weight:700;font-size:15px;color:var(--accent);margin-left:8px;flex:none;padding:4px 2px}
.toast.out{animation:sout .2s ease-in forwards}
@keyframes sin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sout{to{opacity:0;transform:translateY(8px)}}
.savesub{margin:0;padding:24px 16px 20px;font-weight:600;font-size:16px;line-height:1.4;color:var(--muted-warm)}
.newlist{display:flex;flex-direction:column;gap:10px}
.newlist input{height:48px;border-radius:12px;border:1.5px solid var(--accent);background:var(--card);padding:0 16px;font:400 16px var(--f-body);color:var(--text);outline:none}
.newlist .row2{display:flex;gap:12px}.newlist .row2 .btn{flex:1}
.advice{display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:700;font-size:16px;color:var(--ink)}
.advice img{width:28px;height:28px;border-radius:999px;border:2px solid #fff;box-shadow:var(--shadow)}
.ifoot{position:absolute;left:16px;right:16px;bottom:48px;display:flex;flex-direction:column;gap:12px;z-index:3}
.ifoot .btn{width:100%}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}


/* ---------- guide: flow picker ---------- */
.flows{display:flex;flex-direction:column;gap:6px}
.flows button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:10px 14px;border-radius:12px;border:1px solid var(--page-line);background:var(--page-card);font-size:14px;font-weight:600;color:var(--page-fg)}
.flows button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.flows small{font-weight:500;opacity:.75;font-size:12px}
.ctrl{display:flex;flex-direction:column;gap:8px}
.ctrl .row{display:flex;gap:8px;flex-wrap:wrap}
.ctrl button{font-size:13px;font-weight:600;border:1px solid var(--page-line);border-radius:999px;padding:7px 14px;background:var(--page-card);color:var(--page-fg)}
.ctrl label{display:flex;gap:8px;align-items:center;font-size:14px}
.ctrl p{font-size:13px}

/* ---------- forms (Accesso) ---------- */
.form{display:flex;flex-direction:column;padding:0 16px}
.fgroup{display:flex;flex-direction:column;margin-bottom:22px}
.fgroup.two{flex-direction:row;gap:12px}
.fgroup.two>div{flex:1;min-width:0;display:flex;flex-direction:column}
.lbl{font-weight:700;font-size:14px;line-height:20px;color:var(--text);margin:0 0 10px 4px}
.inp{height:40px;border-radius:12px;background:var(--card);border:1px solid #fff;box-shadow:var(--shadow);padding:0 12px;font:400 16px var(--f-body);color:var(--text);width:100%;min-width:0;outline:none}
.inp::placeholder{color:var(--muted)}
.inp:focus{border-color:var(--accent)}
.inp.bad{border-color:rgba(217,60,60,.55);box-shadow:0 0 0 4px rgba(217,60,60,.10)}
.err{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin:8px 0 0;padding:5px 10px 5px 7px;border-radius:999px;background:rgba(217,60,60,.10);color:#B42F2F;font-size:13px;line-height:17px;font-weight:600}
.err svg{flex:none}
.btn.white{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:1px solid #fff;height:40px;width:100%}
.btn.md{height:40px}
.btn.wide{width:100%}
.divider{display:flex;align-items:center;gap:16px;color:var(--muted-warm);font-size:14px;margin:8px 0 24px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--outline)}
.tlink{color:var(--accent);font-weight:600;font-size:14px;text-align:center;padding:10px 0}
.tlink.left{text-align:left;align-self:flex-start;padding:2px 4px 14px}
.help{font-size:14px;line-height:1.45;color:var(--muted-warm);margin:0}
.brand{text-align:center;padding:calc(var(--sb) + 52px) 16px 24px}
.brand h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.4;color:var(--ink)}
.brand p{margin:28px 0 0;font-size:16px;color:var(--muted-warm)}
.stackgap{display:flex;flex-direction:column;gap:16px}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:calc(var(--sb) + 150px) 16px 0}
.done.mid{padding-top:calc(var(--sb) + 150px)}
.done .tick{width:72px;height:72px;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center}
.done h2{margin:12px 0 0;font-family:var(--f-display);font-weight:700;font-size:32px;color:var(--ink)}
.done p{margin:0 0 12px;font-weight:600;font-size:16px;color:var(--muted-warm)}

/* ---------- profile ---------- */
.phead{display:flex;align-items:flex-start;gap:12px;padding:calc(var(--sb) + 4px) 16px 0}
.avl{width:64px;height:64px;border-radius:999px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);object-fit:cover;flex:none;margin-top:2px}
.pid{flex:1;min-width:0}
.pname{margin:0;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.25;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phandle{font-size:15px;color:var(--muted-warm)}
.picons{display:flex;gap:2px;margin-top:6px}
.picons button{width:36px;height:36px;display:grid;place-items:center;color:var(--text);border-radius:999px}
.followbtn{margin:18px 16px 0}
.biolbl{font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--accent);padding:0 16px;margin:18px 0 8px}
.biorow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 16px}
.biotile{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.biotile .im{position:relative;aspect-ratio:1;border-radius:16px;border:2.5px solid var(--accent);overflow:hidden;background:var(--toggle)}
.biotile .im img{width:100%;height:100%;object-fit:cover;display:block}
.biotile .bdg{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:999px;background:rgba(48,46,44,.8);color:#fff;display:grid;place-items:center}
.biotile .cap{font-size:13px;line-height:1.25;font-weight:500;color:var(--ink)}
.ptabs{display:grid;grid-template-columns:1fr 1fr;margin:22px 16px 0}
.ptab{height:44px;font-size:17px;color:var(--ink);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ptab[aria-selected="true"]{font-weight:600}
.ptab[aria-selected="true"]::after{content:"";position:absolute;left:16%;right:16%;bottom:0;height:2px;background:var(--accent);border-radius:2px}
.nbadge{min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px}
.chips{display:flex;gap:8px;padding:16px 16px 8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:40px;padding:0 18px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:16px;color:var(--ink);flex:none}
.chip.on{background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:8px 16px 130px}
.gcard{text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.gcard .im{position:relative;border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:var(--shadow);aspect-ratio:1/1.04;background:var(--toggle)}
.gcard .im.wide{aspect-ratio:1/.78}
.gcard .im img{width:100%;height:100%;object-fit:cover;display:block}
.gcard .t{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.08;color:var(--ink)}
.gcard .m{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted-warm)}
.gcard .m span{display:inline-flex;align-items:center;gap:6px}
.gcard .m img{width:20px;height:20px;border-radius:999px}
.gcard .bmk{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:999px;background:rgba(250,250,250,.92);color:var(--accent);display:grid;place-items:center}
.scamb{display:flex;align-items:center;gap:12px;margin:10px 16px 0;padding:14px 4px;border-bottom:1px solid var(--rule);color:var(--muted-warm);font-size:16px;width:calc(100% - 32px);text-align:left}
.scamb svg:first-child{color:var(--ink)}
.scamb span{flex:1}
.scamb svg:last-child{color:var(--ink)}
.navbar{position:absolute;left:16px;right:16px;bottom:34px;height:68px;border-radius:999px;background:rgba(250,250,250,.97);box-shadow:0 4px 16px rgba(0,0,0,.12);display:grid;grid-template-columns:repeat(4,1fr);padding:4px;z-index:4}
.nav{border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--muted-warm)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* ---------- BIO ---------- */
.bauthor{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px}
.bauthor .who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;color:var(--ink)}
.bauthor .who img{width:24px;height:24px;border-radius:999px;border:1.5px solid #fff;box-shadow:var(--shadow)}
.xpill{height:32px;border-radius:999px;background:var(--accent-soft);color:var(--accent-press);font-weight:600;font-size:14px;padding:0 12px;display:inline-flex;align-items:center;gap:6px}
.card.blur{filter:blur(6px);opacity:.6;pointer-events:none}
.card.blur.b2{opacity:.45}
.bpanel{position:absolute;left:16px;right:16px;bottom:36px;background:var(--accent-soft);border-radius:16px;padding:22px 16px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3;box-shadow:0 -16px 30px 6px rgba(250,246,240,.9)}
.bpanel>svg{color:var(--accent)}
.bpanel h4{margin:4px 0 0;font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.25;color:var(--ink)}
.bpanel p{margin:0 0 8px;font-size:14px;line-height:1.45;color:var(--muted-warm)}
.bpanel .btn{width:100%}
.bpanel .two{display:flex;gap:12px;width:100%}
.bpanel .two .btn{flex:1}
.btn.waiting{background:transparent;border:1.5px solid var(--disabled);color:var(--muted-warm);box-shadow:none;cursor:default}
.sheet .sub{margin:-12px 0 12px;text-align:center;font-size:15px;color:var(--muted-warm);padding:0 16px}
.brow{display:flex;align-items:center;gap:14px;width:100%;padding:8px 16px;text-align:left}
.brow img{width:48px;height:48px;border-radius:12px;border:2px solid var(--accent);object-fit:cover;flex:none}
.brow .t{font-size:16px;font-weight:500;color:var(--text);line-height:1.3}
.brow .s{font-size:13px;color:var(--muted-warm)}
.brow:active{background:rgba(0,0,0,.04)}

/* ---------- notifications ---------- */
.nlist{display:flex;flex-direction:column;gap:12px;padding:20px 16px 60px}
.ncard{background:var(--card);border:1px solid #fff;border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.ncard.row{flex-direction:row;align-items:center;padding:8px 12px 8px 8px}
.nrow{display:flex;gap:12px;align-items:flex-start}
.nav40{width:40px;height:40px;border-radius:999px;border:2px solid #fff;box-shadow:var(--shadow);object-fit:cover;flex:none}
.nimg{width:64px;height:64px;border-radius:4px;object-fit:cover;flex:none}
.nt{font-weight:700;font-size:14px;line-height:1.35;color:var(--ink)}
.ns{font-size:13px;line-height:1.4;color:var(--muted-warm);margin-top:2px}
.ncard .btn{align-self:flex-start}
.nempty{padding:40px 16px;text-align:center;color:var(--muted-warm);font-size:15px;line-height:1.5}

/* ---------- import ---------- */
.drop{margin:4px 16px 0;border:1.5px solid #F7CFBB;border-radius:16px;background:var(--card);min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:20px 16px;cursor:pointer;width:calc(100% - 32px)}
.drop svg{color:var(--accent);margin-bottom:6px}
.drop .dt{font-weight:700;font-size:16px;color:var(--ink)}
.drop .ds{font-size:14px;color:var(--muted-warm)}
.drop.over{background:var(--accent-soft)}
.sample{margin:12px 16px 0;align-self:flex-start}
.metaline{margin:0;padding:20px 16px 12px;font-weight:600;font-size:15px;color:var(--muted-warm)}
.okpill{margin:0 16px;min-height:44px;border-radius:999px;background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-fg);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;padding:0 16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card.text .tx{padding-left:6px}
.more-line{text-align:center;font-size:14px;color:var(--muted-warm);padding:4px 0}
.ph.none{display:grid;place-items:center;background:var(--toggle);color:var(--muted-warm);font-family:var(--f-display);font-weight:700;font-size:22px}
@media (max-width:520px){.navbar{bottom:16px}.bpanel{bottom:16px}}

@media (max-width:860px){.shell{gap:32px}.guide{width:260px}}
@media (max-width:720px){
  .shell{flex-direction:column;align-items:center;padding:0 0 24px}
  .guide{width:auto;max-width:520px;padding:24px 16px 0;order:2}
}
@media (max-width:520px){
  :root{--sb:4px}
  .shell{padding:0 0 24px}
  .stage{width:100%!important}
  .device{width:100%;padding:0;border-radius:0;background:none;box-shadow:none;transform:none!important}
  .stage{height:auto!important}
  .phone{width:100%;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-radius:0}
  .island,.status{display:none}
  .sheet{bottom:16px}
}
/* schermo intero da mobile */
.fullpill,.fullgo{display:none}
@media (max-width:520px){
  .fullpill{position:fixed;z-index:200;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:rgba(28,26,25,.82);color:#fff;border-radius:999px;padding:4px 4px 4px 14px;box-shadow:0 8px 24px -8px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:pillIn .35s ease-out both}
  .fullpill button{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:6px 6px 6px 0;color:#fff}
  .fullpill .x{width:30px;height:30px;justify-content:center;padding:0;border-radius:999px;opacity:.7}
  .fullgo{display:flex;align-items:center;justify-content:center;gap:8px;align-self:stretch;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:12px 16px;font-size:15px;font-weight:600}
  html.full,html.full body{height:100%;overflow:hidden;overscroll-behavior:none}
  html.full .shell{padding:0}
  html.full .guide,html.full .fullpill{display:none}
}
@keyframes pillIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- full app: tab headers, feed, forms, sheets ---------- */
.thead{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sb) + 8px) 16px 0;min-height:calc(var(--sb) + 52px)}
.thead h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:32px;line-height:44px;color:var(--ink)}
.thead .tbtn{width:44px;height:44px;display:grid;place-items:center;color:var(--text);border-radius:999px;position:relative;margin-right:-8px}
.thead .dotbadge{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:999px;background:var(--accent);border:2px solid var(--surface)}
.tsearch{padding:24px 16px 0}
.search.big{height:48px}
.tchips{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none}
.tchips::-webkit-scrollbar{display:none}
.gridwrap{padding:24px 0 150px}
.gridwrap .grid{padding:0 16px}
.gcard .im.wide{aspect-ratio:1.35/1}
.gcard .m.two{justify-content:space-between}
.gcard .m .who{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab.tab{bottom:114px}
.empty-note{padding:32px 16px;text-align:center;color:var(--muted-warm);font-size:15px;line-height:1.5}

/* avatar fallback */
.avi{display:inline-grid;place-items:center;border-radius:999px;background:#E7DED4;color:var(--accent-press);font-weight:700;flex:none;overflow:hidden}
.avi img{width:100%;height:100%;object-fit:cover;display:block}

/* home feed */
.feed{display:flex;flex-direction:column;gap:36px;padding:28px 16px 150px}
.fcard{display:flex;flex-direction:column;gap:0}
.fmeta{display:flex;align-items:center;gap:8px;height:28px;font-size:16px;color:var(--muted-warm);min-width:0}
.fmeta .avi{width:24px;height:24px;font-size:11px;border:1.5px solid #fff;box-shadow:var(--shadow)}
.fmeta b{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fmeta .when{margin-left:auto;font-size:14px;white-space:nowrap}
.fphoto{position:relative;display:block;width:100%;height:180px;border-radius:12px;overflow:hidden;margin-top:4px;background:var(--toggle)}
.fphoto img{width:100%;height:100%;object-fit:cover;display:block}
.fphoto .bmk{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:999px;background:rgba(250,250,250,.94);color:var(--accent);display:grid;place-items:center}
.ftitle{margin:14px 0 0;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.25;color:var(--ink);text-align:left}
.fquote{margin:6px 0 0;font-size:16px;line-height:1.4;color:var(--ink)}
.fmore{margin-top:18px;text-align:left;color:var(--accent);font-size:15px;display:inline-flex;align-items:center;gap:6px}

/* speed dial */
.dial{position:absolute;inset:0;z-index:45;background:rgba(43,32,24,.94);opacity:0;transition:opacity .2s;pointer-events:none}
.dial.on{opacity:1;pointer-events:auto}
.dial .stack2{position:absolute;right:16px;bottom:200px;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.dial .pill{height:52px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:17px;display:inline-flex;align-items:center;gap:12px;padding:0 22px 0 18px;transform:translateY(10px);opacity:0;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s}
.dial.on .pill{transform:none;opacity:1}
.dial.on .pill:nth-child(2){transition-delay:.04s}
.dial .close{position:absolute;right:33px;bottom:114px;width:64px;height:64px;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center}
.dial.inlist .stack2{bottom:160px}.dial.inlist .close{bottom:74px}

/* forms (lists, items, account) */
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.sw{width:56px;height:32px;border-radius:999px;background:#E2DDD8;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--accent)}

.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.swrow .lbl{margin:0}
.swrow.pref{min-height:60px}
.swrow.pref .lbl{font-size:15px;margin:0}
.covbtn{display:flex;align-items:center;justify-content:center;gap:10px}
.covbtn img{width:28px;height:28px;border-radius:6px;object-fit:cover}
.note{margin:12px 0 0;font-size:14px;line-height:1.45;color:var(--muted-warm)}
.ta{min-height:96px;padding:10px 12px;resize:vertical;font:400 16px/1.4 var(--f-body);height:auto}
.sticky-cta{position:sticky;bottom:0;padding:12px 0 24px;background:linear-gradient(to bottom,rgba(250,246,240,0),var(--surface) 12px)}
.linkred{color:var(--danger);font-weight:600;font-size:16px;text-align:center;padding:12px 0}
.prose{padding:20px 16px 0;display:flex;flex-direction:column;gap:18px}
.prose p{margin:0;font-size:15px;line-height:1.5;color:var(--muted-warm)}

/* list empty + add */
.lempty{padding:6px 28px 0;font-size:16px;line-height:1.45;color:var(--muted-warm)}
.sublbl{margin:0;padding:10px 16px 12px;font-weight:600;font-size:15px;color:var(--muted-warm)}

/* cover picker sheet */
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 12px}

.qrow .ph.poster b,.rrow .ph.poster b{font-size:8px}
.qrow .ph.poster i,.rrow .ph.poster i{display:none}
.gcard .im .poster{position:absolute;inset:0;font-size:22px;padding:14px}
.phero{position:relative;height:470px;margin-top:-1px;overflow:hidden}
.phero .bgblur{position:absolute;inset:-40px;filter:blur(28px);opacity:.9}
.phero .card{position:absolute;left:50%;top:117px;width:125px;height:187px;margin-left:-62.5px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:20px;padding:14px 12px;min-height:0;border:0}
.phero .curvewrap{top:382px}

/* search results */
.seclbl{margin:24px 16px 10px;font-size:14px;font-weight:600;letter-spacing:.04em;color:var(--accent);text-transform:uppercase}
.pcard{display:flex;align-items:center;gap:16px;padding:8px 12px 8px 8px;background:var(--card);border:1px solid #fff;border-radius:12px;box-shadow:var(--shadow);width:100%;text-align:left;min-height:80px}
.pcard .avi{width:64px;height:64px;font-size:22px}
.pcard .t{font-weight:700;font-size:17px;color:var(--text)}
.pcard .s{font-size:15px;color:var(--muted-warm)}
.searchbar2{display:flex;align-items:center;gap:16px;padding:calc(var(--sb) + 8px) 16px 0}
.searchbar2 .search{flex:1}
.searchbar2 .cancel{color:var(--accent);font-weight:600;font-size:17px}

let SCALE = 1;
function fit(){
  const dev = q('#device'), stage = q('#stage');
  if (innerWidth <= 520){ SCALE = 1; dev.style.transform=''; stage.style.height=''; stage.style.width=''; dev.style.marginLeft=''; return; }
  SCALE = Math.min(1, (innerHeight - 48) / 876);
  dev.style.transform = SCALE < 1 ? `scale(${SCALE})` : '';
  stage.style.height = (876*SCALE) + 'px'; stage.style.width = (417*SCALE) + 'px';
  dev.style.marginLeft = SCALE < 1 ? ((417*SCALE-417)/2)+'px' : '';
}
addEventListener('resize', fit); fit();

/* schermo intero da mobile: nasconde la guida e, dove il browser lo permette, va in fullscreen vero */
(function fullMode(){
  const root = document.documentElement, pill = q('#fullpill');
  let fs = false;
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  function enter(){
    root.classList.add('full'); scrollTo(0, 0);
    const req = root.requestFullscreen || root.webkitRequestFullscreen;
    if (req) { try { const p = req.call(root, { navigationUI: 'hide' }); fs = true; if (p && p.catch) p.catch(() => { fs = false; }); } catch (e) { fs = false; } }
  }
  function leave(){ root.classList.remove('full'); }
  document.querySelectorAll('[data-full]').forEach(b => b.addEventListener('click', enter));
  q('#fullx').addEventListener('click', () => { pill.remove(); });
  const onChange = () => { if (fs && !fsEl()) { fs = false; leave(); } };
  document.addEventListener('fullscreenchange', onChange);
  document.addEventListener('webkitfullscreenchange', onChange);
  if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) { root.classList.add('full'); pill.remove(); }
})();

function flip(root, mutate){
  const before = new Map();
  root.querySelectorAll('[data-flip]').forEach(n => before.set(n.dataset.flip, n.getBoundingClientRect()));
  mutate();
  if (reduce) return;
  root.querySelectorAll('[data-flip]').forEach(n => {
    const b = before.get(n.dataset.flip);
    if (!b){ n.animate([{opacity:0},{opacity:1}],{duration:220,easing:'ease-out'}); return; }
    const a = n.getBoundingClientRect();
    const dx = (b.left-a.left)/SCALE, dy = (b.top-a.top)/SCALE;
    if (Math.abs(dx)>.5 || Math.abs(dy)>.5) n.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}

  let bottom = cur && cur.el.querySelector('.ifoot') ? 172 : cur && cur.el.querySelector('.navbar') ? 116 : 48;

  if (fab && fab.offsetParent){ const ph = q('#phone').getBoundingClientRect(), fr = fab.getBoundingClientRect(); bottom = Math.max(bottom, Math.round((ph.bottom - fr.top) / (SCALE||1)) + 10); }
  q('#snacks').style.bottom = bottom + 'px';
  document.querySelectorAll('#toasts .toast,#snacks .toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast ' + kind;
  t.innerHTML = `<span class="d">${kind==='ok' ? ic('check',15,2.6) : kind==='err' ? SVG_ERR : SVG_UNDO}</span><span class="tx">${esc(text)}</span>`;

}

/* ================= navigation ================= */
const stack = [];
const stackEl = q('#stack');
function push(screen, animate=true){
  const prev = stack[stack.length-1];
  stack.push(screen); stackEl.appendChild(screen.el); screen.render();
  if (animate && prev && !reduce){
    screen.el.animate([{transform:'translateX(100%)'},{transform:'none'}],{duration:300,easing:'cubic-bezier(.2,.8,.2,1)'});
    prev.el.animate([{transform:'none',filter:'brightness(1)'},{transform:'translateX(-28%)',filter:'brightness(.92)'}],{duration:300,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>{ if (stack.includes(prev) && stack[stack.length-1]!==prev) prev.el.style.visibility='hidden'; };
  } else if (prev) prev.el.style.visibility='hidden';
  syncStatus();
}
function pop(){
  if (stack.length < 2) return;
  const top = stack.pop(), prev = stack[stack.length-1];
  prev.el.style.visibility=''; prev.render();
  if (!reduce){
    prev.el.animate([{transform:'translateX(-28%)',filter:'brightness(.92)'},{transform:'none',filter:'brightness(1)'}],{duration:300,easing:'cubic-bezier(.2,.8,.2,1)'});
    top.el.animate([{transform:'none'},{transform:'translateX(100%)'}],{duration:300,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>top.el.remove();
  } else top.el.remove();
  syncStatus();
}
/* remove screens under the top one without animation (used to "replace" a step) */
function purgeSteps(){ for (let i=stack.length-2;i>=0;i--){ if (stack[i].step){ stack[i].el.remove(); stack.splice(i,1); } } }
function dropBelowTop(n){ const top = stack.pop(); for (let i=0;i<n;i++){ const s = stack.pop(); s && s.el.remove(); } stack.push(top); }
function popTo(pred){
  const idx = stack.map(pred).lastIndexOf(true);
  if (idx < 0) return false;
  while (stack.length-1 > idx+1){ const s = stack.splice(stack.length-2,1)[0]; s.el.remove(); }
  if (stack.length-1 > idx) pop(); else { const s=stack[idx]; s.el.style.visibility=''; s.render(); }
  return true;
}
function syncStatus(){ const s = stack[stack.length-1]; const layer = document.querySelector('#phone > .mile, #phone > .cele'); q('#status').classList.toggle('dark', !!layer || !(s && s.onHero && s.onHero())); }
const current = () => stack[stack.length-1];
function refreshAll(){ stack.forEach(s => s.refresh && s.refresh()); }

const ov = q('#ov');
function openOverlay(html, onMount){
  ov.innerHTML = `<div class="scrim"></div>${html}`;
  q('.scrim', ov).onclick = closeOverlay;
  requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add('on')));
  onMount && onMount(ov);
  const f = ov.querySelector('button'); f && setTimeout(()=>f.focus({preventScroll:true}), 60);
}
function closeOverlay(){
  return new Promise(res => {
    if (!ov.classList.contains('on')){ ov.innerHTML=''; res(); return; }
    ov.classList.remove('on');
    setTimeout(()=>{ ov.innerHTML=''; res(); }, reduce ? 0 : 230);
  });
}

  let e = g.querySelector('.err'); if (!msg){ e && e.remove(); return; }
  if (!e){ e = document.createElement('p'); e.className='err'; g.appendChild(e); }
  e.innerHTML = SVG_ERR + `<span>${esc(msg)}</span>`;
}

const TABS = { home:()=>Home(), esplora:()=>Esplora(), liste:()=>MyListsTab(), profilo:()=>Profile() };
let TAB = 'home';
function clearToasts(){ document.querySelectorAll('#toasts .toast,#snacks .toast').forEach(t=>t.remove()); }
function goTab(t){
  closeOverlay(); closeDial(); clearToasts();
  const curNav = q('.screen:last-child .navbar', stackEl);
  NAVFROM = curNav ? curNav.dataset.active : null;
  TAB = t; stack.splice(0).forEach(s=>s.el.remove()); stackEl.innerHTML='';
  push(TABS[t](), false); NAVFROM = null; renderGuide();
  const scr = current().el, nb = q('.navbar', scr);
  if (nb && !reduce){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ nb.style.setProperty('--i', NAVT.indexOf(t)); nb.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on', b.dataset.nav===t)); }));
    const sc = q('.scroller', scr); sc && sc.animate([{opacity:.25, transform:'translateY(6px)'},{opacity:1, transform:'none'}],{duration:240, easing:'ease-out'});
  } else if (nb){ nb.style.setProperty('--i', NAVT.indexOf(t)); nb.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on', b.dataset.nav===t)); }
}

/* speed dial (FAB on tab screens) */
function openDial(target){
  const inList = target && target!=='tab';
  const d = document.createElement('div'); d.className = 'dial' + (inList?' inlist':'');
  d.innerHTML = `<div class="stack2"><button class="pill" data-d="item">${ic('plus',22,2.4)}Aggiungi elemento</button><button class="pill" data-d="list">${ic('plus',22,2.4)}Nuova lista</button></div><button class="close" data-d="close" aria-label="Chiudi">${ic('x',26,2.4)}</button>`;
  q('#phone').appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('on')));
  d.addEventListener('click', e => {
    const b = e.target.closest('[data-d]'); const a = b ? b.dataset.d : 'close';
    closeDial();
    if (a==='item') push(AddItem(inList ? target : null));
    if (a==='list') push(NewList());
  });
}
function closeDial(){ const d = q('.dial'); if (!d) return; d.classList.remove('on'); setTimeout(()=>d.remove(), reduce?0:200); }

const publicLists = () => Object.values(S.L).filter(l => l.by!=='me');
function listCard(l, opt={}){
  const n = count(l);
  const saved = l.followed;
  const meta = opt.mine
    ? `<span class="m"><span>${opt.topMeta ? `Top 10${l.coda.length?` · ${l.coda.length} in coda`:''}` : plural(n,'elemento','elementi')}</span></span>`
    : `<span class="m two"><span class="who">${avatar(l.by,20)}@${l.by}</span><span>${plural(n,'elemento','elementi')}</span></span>`;
  return `<button class="gcard" data-list="${l.key}"><span class="im ${opt.wide?'wide':''}">${coverHTML(l)}${opt.mine?'':`<span class="bmk" data-follow="${l.key}" role="button" aria-label="${saved?'Smetti di seguire':'Segui'} ${esc(l.t)}">${ic('bm',18,2,saved?'currentColor':'none')}</span>`}</span><span class="t">${esc(l.t)}</span>${meta}</button>`;
}
function followToggle(key){ const l=LST(key); l.followed=!l.followed; refreshAll(); if (l.followed) bump(`[data-follow="${key}"]`); toast(l.followed?`Ora segui «${l.t}»`:`Non segui più «${l.t}»`, l.followed?'ok':'info'); }

function Search(init=''){
  let qv = init, kind = 'Tutto';
  const el = screen(`<div class="topbar"></div><div class="scroller"><div class="thead"><h2>Cerca</h2></div>
    <div class="tsearch"><label class="search big">${ic('search',20,2)}<input id="sQ" type="search" placeholder="Cerca liste, persone, elementi" autocomplete="off" aria-label="Cerca"></label></div>
    <div class="tchips">${['Tutto','Liste','Persone','Elementi'].map(c=>`<button class="chip" data-k="${c}" aria-pressed="${c===kind}">${c}</button>`).join('')}</div>
    <div data-res></div></div>${navbar('esplora')}`);
  watchTop(el);
  const input = q('#sQ',el); input.value = qv;
  input.addEventListener('input', () => { qv = input.value; render(); });
  setTimeout(()=>input.focus({preventScroll:true}), 350);
  function render(){
    el.querySelectorAll('[data-k]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.k===kind));
    const box = q('[data-res]',el); const t = norm(qv.trim());
    if (!t){ box.innerHTML = `<p class="empty-note">Cerca persone, liste o un posto, un film, un libro.<br>Prova con «islanda» o «torino».</p>`; return; }
    const people = Object.values(PEOPLE).filter(p => norm(p.name+' '+p.h).includes(t) || Object.values(S.L).some(l => l.by===p.h && norm(l.t+' '+l.sub).includes(t)));
    const lists = Object.values(S.L).filter(l => l.by!=='me' && !l.priv && (norm(l.t+' '+l.sub).includes(t) || [...l.top,...l.coda].some(id => norm(I[id].n+' '+(I[id].a||'')).includes(t))));
    const items = Object.keys(I).filter(id => norm(I[id].n+' '+(I[id].a||'')+' '+(I[id].k||'')).includes(t)).slice(0,8);
    const show = k => kind==='Tutto' || kind===k;
    let h = '';
    if (show('Persone') && people.length) h += `<p class="seclbl">Persone</p><div class="cards" style="padding-top:0">${people.map(p=>{ const n = Object.values(S.L).filter(l=>l.by===p.h && norm(l.t+' '+l.sub+' '+[...l.top,...l.coda].map(id=>I[id].n+' '+(I[id].a||'')).join(' ')).includes(t)).length;
      return `<button class="pcard" data-person="${p.h}">${avatar(p.h,64)}<span><span class="t" style="display:block">@${p.h}</span><span class="s">${esc(p.name)}${n?` · ${plural(n,'lista','liste')} su «${esc(qv.trim())}»`:''}</span></span></button>`; }).join('')}</div>`;
    if (show('Liste') && lists.length) h += `<p class="seclbl">Liste</p><div class="grid" style="padding:0 16px">${lists.map(l=>listCard(l,{wide:true})).join('')}</div>`;
    if (show('Elementi') && items.length) h += `<p class="seclbl">Elementi</p><div class="cards" style="padding-top:0">${items.map(id=>`<button class="card" data-item="${id}">${thumb(id)}<span class="tx"><span class="t">${esc(I[id].n)}</span><span class="s">${esc(I[id].k||I[id].a||'')}</span></span></button>`).join('')}</div>`;
    if (!h) h = `<div class="noresult"><h3>Nessuno l'ha ancora consigliato</h3><p>Puoi essere tu il primo: crea una lista e mettici quello che cercavi.</p><button class="btn sm fill" data-a="create">Crea la lista</button></div>`;
    box.innerHTML = h + '<div style="height:150px"></div>';
  }
  el.addEventListener('click', e => {
    const f = e.target.closest('[data-follow]'); if (f){ e.stopPropagation(); followToggle(f.dataset.follow); return; }
    const k = e.target.closest('[data-k]'); if (k){ kind = k.dataset.k; render(); return; }
    const l = e.target.closest('[data-list]'); if (l){ push(ListScreen(l.dataset.list)); return; }
    const it = e.target.closest('[data-item]'); if (it){ const id = it.dataset.item; const src = Object.values(S.L).find(x=>x.top.includes(id)||x.coda.includes(id)); push(ItemScreen(id, src ? src.key : null)); return; }
    if (e.target.closest('[data-a="create"]')) push(NewList({t:qv.trim()}));
  });
  return { el, render, refresh: render, onHero: () => false };
}

/* ================= LIST DETAIL ================= */
function ListScreen(key){
  const l = LST(key); const mine = l.by==='me';
  const el = screen(`<div class="topbar"></div><div class="scroller"><div data-body></div></div>${mine?`<button class="fab" data-a="add" aria-label="Aggiungi elemento">${ic('plus',28,2)}</button>`:''}`);
  const sc = q('.scroller',el), tb = q('.topbar',el), body = q('[data-body]',el);
  let heroVisible = true, built = false;
  sc.addEventListener('scroll', () => { const v = sc.scrollTop < 300; tb.classList.toggle('on', !v); if (v!==heroVisible){ heroVisible=v; syncStatus(); } }, {passive:true});
  const card = id => { const it = I[id];
    const trail = mine ? `<span class="more" role="button" tabindex="0" data-menu="${id}" aria-label="Opzioni per ${esc(it.n)}">${dots(18)}</span>`
      : `<span class="save" role="button" tabindex="0" data-save="${id}" aria-label="${S.saved.has(id)?'Togli dai salvati':'Salva in una lista'} ${esc(it.n)}" aria-pressed="${S.saved.has(id)}">${ic('bm',22,2,S.saved.has(id)?'currentColor':'none')}</span>`;
    return `<button class="card" data-flip="${id}" data-open="${id}">${thumb(id)}<span class="tx"><span class="t">${esc(it.n)}</span><span class="s">${esc(it.a||it.k||'')}</span></span>${trail}</button>`; };
  const qrow = id => { const it = I[id];
    const trail = mine ? `<span class="ic" role="button" tabindex="0" data-menu="${id}" aria-label="Opzioni per ${esc(it.n)}">${dots(24)}</span>`
      : `<span class="ic save" role="button" tabindex="0" data-save="${id}" aria-label="Salva ${esc(it.n)}" aria-pressed="${S.saved.has(id)}">${ic('bm',22,2,S.saved.has(id)?'currentColor':'none')}</span>`;
    return `<button class="qrow" data-flip="${id}" data-open="${id}">${thumb(id)}<span class="tx"><span class="t">${esc(it.n)}</span><span class="s">${esc(it.k||it.a||'')}</span></span>${trail}</button>`; };
  function shell(){
    const empty = !count(l);
    const hp = heroPoster(l); const act = `<div class="actions"><button class="round" data-a="back" aria-label="Indietro">${ic('left',22,1.8)}</button><button class="round" data-a="listmenu" aria-label="Opzioni lista">${dots(22)}</button></div>`;
    body.innerHTML = (hp ? `<div class="hero lposter"><div class="bgblur" style="background:radial-gradient(circle at 50% 40%, ${I[hp].bg} 0%, ${I[hp].bg} 35%, #2b2b2b 130%)"></div>${posterHTML(hp,'pcard')}<div class="curvewrap"><div class="curve"></div></div>${act}</div>` : `<div class="hero"><img src="${heroSrc(l)}" alt=""><div class="curvewrap"><div class="curve"></div></div>${act}</div>`) + `
      <div class="content">
        <div class="ttl"><h2>${esc(l.t)}</h2>${l.sub?`<p>${esc(l.sub)}</p>`:''}</div>
        ${mine ? '' : `<div class="author"><button class="who" data-person="${l.by}">${avatar(l.by,24)}di @${l.by}</button><button class="btn sm fill" data-a="follow"></button></div>`}
        ${empty && mine ? `<p class="lempty">Non c'è ancora niente qui dentro.<br>Aggiungi il primo ${l.cat==='Film'?'film':l.cat==='Libri'?'libro':l.cat==='Ristoranti'?'ristorante':l.cat==='Luoghi'?'posto':'elemento'} che vuoi consigliare.</p><div class="pad" style="padding-top:20px"><button class="btn fill wide" data-a="add">Aggiungi il primo elemento</button></div>` : `
        <div class="filters">
          <label class="search">${ic('search',20,2)}<input type="search" placeholder="${mine?'Cerca tra i tuoi elementi':'Cerca in questa lista'}" autocomplete="off" aria-label="Cerca in questa lista"><button class="clear" data-a="clear" aria-label="Svuota ricerca" hidden>${ic('x',18,2)}</button></label>
          <button class="icon-btn" data-a="filter" aria-label="Filtri">${ic('filter',22,2)}</button>
        </div>
        <div class="cards" data-lists></div>`}
      </div>`;
    q('.fab',el) && (q('.fab',el).hidden = empty);
    const input = q('input',body);
    if (input){ input.value = S.q[key]||''; const clr = q('[data-a="clear"]',body); clr.hidden = !input.value;
      input.addEventListener('input', () => { S.q[key]=input.value; clr.hidden=!input.value; renderLists(); }); }
    built = empty ? 'empty' : 'full';
  }
  function renderLists(){
    if (!LST(key)) return;
    const empty = !count(l);
    if (!built || (built==='empty') !== empty) shell();
    q('.ttl h2',body).textContent = l.t; const sub = q('.ttl p',body); if (sub) sub.textContent = l.sub;
    if (!mine){ const f=q('[data-a="follow"]',el); f.textContent = l.followed ? 'Seguita' : 'Segui la lista'; f.className = 'btn sm ' + (l.followed ? 'outline-accent' : 'fill'); f.setAttribute('aria-pressed', l.followed); }
    const box = q('[data-lists]',body); if (!box) return;
    const qq = norm((S.q[key]||'').trim());
    const match = id => !qq || norm(I[id].n+' '+(I[id].a||'')+' '+(I[id].k||'')).includes(qq);
    const top = l.top.filter(match), coda = l.coda.filter(match);
    const open = qq ? true : !!S.codaOpen[key];
    let h = `<div class="sec-h"><span class="l"><h3>Top 10</h3><span class="n">${l.top.length} di ${MAX}</span></span>${mine?'<button class="link" data-a="edit">Modifica</button>':''}</div>`;
    if (qq && !top.length && !coda.length) h += `<div class="empty">Nessun elemento per «${esc(S.q[key].trim())}».</div>`;
    else if (!l.top.length) h += `<div class="empty">La Top 10 è vuota. Apri la coda e scegli cosa mettere in evidenza.</div>`;
    h += top.map(card).join('');
    if (l.coda.length && (!qq || coda.length)){
      h += `<button class="toggle" data-a="coda" aria-expanded="${open}" data-flip="__toggle"><span class="l"><b>In coda</b><span>${qq ? coda.length+' di '+l.coda.length : l.coda.length} element${l.coda.length===1?'o':'i'}</span></span>${ic('down',24,2)}</button>`;
      if (open) h += `<div class="qlist">${coda.map(qrow).join('')}</div>`;
    }
    box.innerHTML = h;
  }
  el.addEventListener('click', e => {
    const m = e.target.closest('[data-menu]'); if (m){ e.stopPropagation(); itemMenu(key, m.dataset.menu); return; }
    const sv = e.target.closest('[data-save]'); if (sv){ e.stopPropagation(); toggleSave(sv.dataset.save, key); return; }
    const o = e.target.closest('[data-open]'); if (o){ push(ItemScreen(o.dataset.open, key)); return; }
    const a = e.target.closest('[data-a]'); if (!a) return;
    switch (a.dataset.a){
      case 'coda': { const box=q('[data-lists]',body); flip(box, ()=>{ S.codaOpen[key]=!S.codaOpen[key]; renderLists(); });
        if (S.codaOpen[key]) setTimeout(()=>{ const t=q('[data-a="coda"]',el); if(t){ const r=t.getBoundingClientRect(), sr=sc.getBoundingClientRect(); const target = sc.scrollTop + (r.top-sr.top)/SCALE - 120; sc.scrollTo({top:Math.max(sc.scrollTop,target),behavior:reduce?'auto':'smooth'}); } },60); break; }
      case 'edit': push(Reorder(key)); break;
      case 'follow': followToggle(key); break;
      case 'back': if (stack.length>1) pop(); break;
      case 'listmenu': mine ? listMenu(key) : sheet(l.t, [['share','Condividi lista'],['report','Segnala lista','red']], k => k==='share' ? sysShare() : confirmDialog({title:'Segnalare la lista?', text:`Ci dici che «${l.t}» non rispetta le regole di Listup. La controlliamo entro 24 ore; @${l.by} non sa chi l'ha segnalata.`, ok:'Segnala'}, ()=>toast('Segnalazione inviata, grazie'))); break;
      case 'filter': sheet('Mostra', [['all','Tutti gli elementi'],['top','Solo la Top 10'],['coda','Solo la coda']], k => { S.codaOpen[key] = k!=='top'; if (k==='coda'){ const b=q('[data-a="coda"]',el); b && b.scrollIntoView({behavior:reduce?'auto':'smooth'}); } renderLists(); }); break;
      case 'add': push(AddItem(key)); break;
      case 'clear': { const i=q('input',body); i.value=''; S.q[key]=''; a.hidden=true; renderLists(); i.focus(); break; }
    }
  });
  el.addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && e.target.matches('[data-menu],[data-save]')){ e.preventDefault(); e.target.click(); }});
  return { el, render: renderLists, refresh: renderLists, onHero: () => heroVisible, listKey:key };
}

    else if (k==='bio'){ if (l.bio){ l.bio=false; S.bios=S.bios.filter(x=>x!==key); refreshAll(); toast(`«${l.t}» non è più una BIO`,'info'); } else makeBio(key); }
    else if (k==='priv'){ if (l.bio && !l.priv){ toast('Le liste BIO sono sempre pubbliche','info'); return; } l.priv=!l.priv; refreshAll(); toast(l.priv?'Ora la lista è privata: la vedi solo tu':'Ora la lista è pubblica'); }

/* ================= SAVE / ADD ================= */
function toggleSave(id, from){
  if (S.saved.has(id)) return unsave(id);
  const l = from && LST(from);
  push(ListPicker({title:'Salva in una lista', sub: l ? `${I[id].n}, da «${l.t}» di @${l.by}` : I[id].n, cat: CAT[I[id].cat],
    onPick: key => { if (where(key,id)){ toast(`«${I[id].n}» è già in «${LST(key).t}»`,'info'); return; }
      push(AdviceStep({id, key, other: l && l.by!=='me' ? l.by : null, cta:'Salva nella lista', onDone: () => { dropBelowTop(1); pop(); doSave(id, key); } })); } }));
}
function fullChoice(l, id, fin){
  choiceSheet({ id, sub: `Dove mettiamo «${esc(I[id].n)}» in «${esc(l.t)}»?`,
    onClose: () => toast('Non abbiamo salvato niente','info'),
    onCoda: () => { l.coda.unshift(id); fin('coda'); },
    onTop: () => push(MakeRoom(l.key, id, { candidates: () => l.top,
      onPick: out => { l.top[l.top.indexOf(out)] = id; l.coda.unshift(out); fin('swap', out); },
      onCancel: () => later(()=>toast('Non abbiamo salvato niente','info')) })) });
}
function doSave(id, key){
  const l = LST(key);
  if (where(key,id)){ later(()=>toast(`«${I[id].n}» è già in «${l.t}»`,'info')); return; }
  const before = l.top.length;
  const fin = (how, out) => { S.addedBySave.add(id); S.saved.set(id, key); if (out) S.swapOut.set(id, out); refreshAll();
    const undo = () => toast(how==='coda' ? `Salvato in coda in «${l.t}»` : `Salvato in «${l.t}»`, 'info', {label:'Annulla', fn:()=>unsave(id, true)});
    celebrate(id, key, how, out, before, undo); };
  if (l.top.length < MAX){ l.top.push(id); later(()=>fin('top')); return; }
  later(()=>fullChoice(l, id, fin));
}
function unsave(id, quiet){
  const key = S.saved.get(id); if (!key) return; const l = LST(key);
  if (l && S.addedBySave.has(id)){ const ti = l.top.indexOf(id), out = S.swapOut.get(id);
    if (out && ti>=0 && l.coda.includes(out)){ l.top[ti] = out; l.coda = l.coda.filter(x=>x!==out); } else l.top=l.top.filter(x=>x!==id);
    l.coda=l.coda.filter(x=>x!==id); S.addedBySave.delete(id); S.swapOut.delete(id); }
  S.saved.delete(id); refreshAll();
  if (!quiet && l) toast(`Tolto da «${l.t}»`, 'info', {label:'Annulla', fn:()=>{ doSave(id, key); }});
}

        : `<button class="btn outline-accent" data-a="new" style="width:100%">Crea una nuova lista</button>`}</div><div style="height:60px"></div>`;
    const inp = q('#lpQ',body); inp.addEventListener('input', () => { qv = inp.value; const p=inp.selectionStart; render(); const n=q('#lpQ',body); n.focus(); n.setSelectionRange(p,p); });
    if (focused) inp.focus();
    if (creating){ const f=q('[data-form]',body), i=q('#lpNew',f); setTimeout(()=>i.focus(),50);

function createList({t, cat='Luoghi', sub='', priv=false, bio=false, cover=null}){
  const key = 'n' + Date.now().toString(36);
  const dflt = {Film:'e3',Libri:'e4',Ristoranti:'f1',Luoghi:'hero',Altro:'h_altro'}[cat]||'hero';
  S.L[key] = { key, t, sub, cat, cover:cover||dflt, hero:cover||dflt, by:'me', priv, bio:false, top:[], coda:[], followed:false, created:true };

}
function addTo(key, id, opt={}){
  const l = LST(key);
  if (where(key,id)){ toast(`«${I[id].n}» è già in «${l.t}»`,'info'); return; }
  if (!opt.advised){ push(AdviceStep({id, key, cta:'Aggiungi alla lista', onDone: () => addTo(key, id, {advised:true}) })); return; }
  const before = l.top.length;
  const go = (how, out) => { if (!popTo(s => s.listKey===key)){ push(ListScreen(key)); purgeSteps(); } later(()=>{ refreshAll(); celebrate(id, key, how, out, before); }); };
  if (l.top.length < MAX){ l.top.push(id); go('top'); return; }
  fullChoice(l, id, go);
}
function bump(sel){ if (reduce) return; requestAnimationFrame(()=>{ const c = current(); const e = c && c.el.querySelector(sel); e && e.animate([{transform:'scale(1)'},{transform:'scale(1.35)'},{transform:'scale(.92)'},{transform:'scale(1)'}],{duration:420,easing:'ease-out'}); }); }

    const topList = q('[data-list="top"]',body), codaList = q('[data-list="coda"]',body);
    const hd = q('[data-codahead]',body).getBoundingClientRect();
    const others = x => [...x.querySelectorAll('.rrow')].filter(n=>n!==r);
    const mid = n => { const b=n.getBoundingClientRect(); return b.top + b.height/2; };
    let target, before = null;
    if (y < hd.top + hd.height/2){ target = topList; before = others(topList).find(n => y < mid(n)) || null; }
    else { target = codaList; before = others(codaList).find(n => y < mid(n)) || null; }
    if (r.parentNode === target && r.nextElementSibling === before) return;
    if (before === r) return;
    target.insertBefore(r, before);
  }
  function loop(){
    if (!drag) return;
    const sr = sc.getBoundingClientRect(), edge = 70*SCALE; let v = 0;
    if (drag.y < sr.top + edge + 60*SCALE) v = -6; else if (drag.y > sr.bottom - edge - 80*SCALE) v = 6;
    if (v){ sc.scrollTop += v; reorderAt(); place(); }
    drag.raf = requestAnimationFrame(loop);
  }
  return { el, render, onHero: () => false };
}

function quickReturn(el){
  // header (titolo, cerca, filtri) che esce scrollando giù e rientra seguendo il dito scrollando su
  const sc = q('.scroller', el); let last = 0, off = 0;
  // il titolo (.pin) resta sempre fisso; cerca e filtri scorrono via sotto di lui e rientrano seguendo il dito
  const apply = () => { const hd = q('.qhead', sc); if (!hd) return; const y = Math.max(0, sc.scrollTop);
    const th = q('.thead.pin', sc), base = th ? th.offsetHeight : 0;
    off = Math.max(0, Math.min(off, hd.offsetHeight, y)); hd.style.top = (base - off) + 'px';
    if (th) th.classList.toggle('lifted', y > 2); };
  sc.addEventListener('scroll', () => { const y = Math.max(0, sc.scrollTop); off += y - last; last = y; apply(); }, {passive:true});
  return { apply };
}
function profileScroll(el){
  // scroll-linked quick return: the BIO strip slides out/in by exactly the pixels scrolled
  const sc = q('.scroller', el); let last = 0, off = 0;
  const apply = () => { const hdr = q('.pfix', sc), mid = q('.pmid', sc), col = q('.pcol', sc); if (!hdr || !mid) return;
    const hH = hdr.offsetHeight, cH = col ? col.offsetHeight : 0, y = Math.max(0, sc.scrollTop);
    off = Math.max(0, Math.min(off, cH, y));
    mid.style.top = (hH - off) + 'px'; };
  sc.addEventListener('scroll', () => { const y = Math.max(0, sc.scrollTop), d = y - last; last = y;
    off += d; apply(); }, {passive:true});
  return { apply: () => { last = Math.max(0, sc.scrollTop); off = 0; apply(); } };
}
function searchAnim(body, on, swap){
  if (reduce){ swap(); return; }
  if (on){
    flip(body, swap);
    const bar = q('.searchbar2 .search', body), c = q('.searchbar2 .cancel', body);
    bar && bar.animate([{clipPath:'inset(0 0 0 calc(100% - 46px) round 12px)', opacity:.6},{clipPath:'inset(0 0 0 0 round 12px)', opacity:1}],{duration:260, easing:'cubic-bezier(.2,.8,.2,1)'});
    c && c.animate([{opacity:0, transform:'translateX(12px)'},{opacity:1, transform:'none'}],{duration:260, delay:60, fill:'backwards', easing:'ease-out'});
  } else {
    const bar = q('.searchbar2 .search', body), c = q('.searchbar2 .cancel', body);
    c && c.animate([{opacity:1},{opacity:0}],{duration:120, fill:'forwards'});
    const a = bar && bar.animate([{clipPath:'inset(0 0 0 0 round 12px)', opacity:1},{clipPath:'inset(0 0 0 calc(100% - 46px) round 12px)', opacity:0}],{duration:200, easing:'ease-in', fill:'forwards'});
    const go = () => flip(body, swap);
    a ? a.onfinish = go : go();
  }
}

const ALIASES = { 'jokulsarlon':'jokulsarlon','laguna di jokulsarlon':'jokulsarlon','myvatn':'myvatn','lago myvatn':'myvatn','vik':'vik','vik i myrdal':'vik','reykjavik':'reykjavik' };
function recognise(line){ const n = norm(line.trim()); if (ALIASES[n]) return ALIASES[n]; for (const [id,it] of Object.entries(I)) if (!it.custom && norm(it.n) === n) return id; return null; }
const SAMPLE = { name:'islanda.csv', lines:['Goðafoss','Svartifoss','Fjaðrárgljúfur','Dyrhólaey','Hallgrímskirkja','Casa di nonna Pina','Stokksnes','Lago Mývatn','Námafjall','Akureyri','Il bar di Siggi a Húsavík','Vestrahorn','Reynisfjara','Dettifoss','Quella curva con i cavalli'] };
function ImportUpload(){
  const el = headScreen('Importa liste', `
    <p class="intro" style="padding-top:20px">Porta su Listup le liste che tieni altrove. Ti basta un file con un elemento per riga: proviamo a riconoscerli noi.</p>
    <label class="drop" for="fileIn" data-drop>${ic('upload',30,2)}<span class="dt">Tocca per caricare un file</span><span class="ds">CSV o TXT · un elemento per riga · max 5 MB</span></label>
    <input id="fileIn" type="file" accept=".csv,.txt,text/csv,text/plain" hidden>
    <p class="intro">Vieni da Letterboxd o Goodreads? Esporta le tue liste dal loro sito e carica qui il file.</p>
    <button class="tlink sample" data-a="sample">Non hai un file? Prova con islanda.csv</button>`);
  const inp = q('#fileIn',el), drop = q('[data-drop]',el);
  const use = (name, text) => {
    const lines = text.split(/\r?\n/).map(l => l.split(/[;,\t]/)[0].replace(/^["']|["']$/g,'').trim()).filter(Boolean).filter((l,i) => !(i===0 && /^(name|nome|titolo|title|elemento)$/i.test(l)));
    if (!lines.length){ toast('Il file è vuoto: serve almeno una riga con un elemento','info'); return; }
    push(ImportPreview(name, lines.slice(0,200)));
  };
  inp.onchange = () => { const f = inp.files[0]; if (!f) return;
    if (f.size > 5*1024*1024){ toast('Il file supera i 5 MB: dividilo in più file','info'); inp.value=''; return; }
    if (!/\.(csv|txt)$/i.test(f.name)){ toast('Serve un file CSV o TXT','info'); inp.value=''; return; }
    const r = new FileReader(); r.onload = () => { use(f.name, String(r.result)); inp.value=''; }; r.readAsText(f); };
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); const f=e.dataTransfer.files[0]; if (f){ const r = new FileReader(); r.onload = () => use(f.name, String(r.result)); r.readAsText(f); } });
  el.addEventListener('click', e => { const a = e.target.closest('[data-a]'); if (!a) return; if (a.dataset.a==='back') pop(); if (a.dataset.a==='sample') use(SAMPLE.name, SAMPLE.lines.join('\n')); });
  return { el, render(){}, onHero: () => false };
}

    q('[data-c]',el).innerHTML = show.map(r => r.id
      ? `<div class="card">${thumb(r.id)}<span class="tx"><span class="t">${esc(I[r.id].n)}</span><span class="s">${esc(I[r.id].k||'')}</span></span></div>`
      : `<div class="card text" style="min-height:64px"><span class="tx"><span class="t">${esc(r.line)}</span><span class="s">Non riconosciuto · lo aggiungiamo come testo</span></span></div>`).join('')
      + (rest>0 ? `<button class="more-line" data-a="all">… e altri ${rest} elementi</button>` : '');
  };
  el.addEventListener('click', e => { const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a==='back') pop(); if (a.dataset.a==='all'){ all=true; render(); }
    if (a.dataset.a==='next') push(ListPicker({title:'Dove li salviamo?', sub:`${rows.length} elementi vanno in coda: la Top 10 la scegli dopo tu`, onPick: key => {
      const l = LST(key); let dup = 0;
      const ids = rows.map(r => { if (r.id) return r.id; const id='t'+Math.random().toString(36).slice(2,8); I[id]={n:r.line,a:'Aggiunto come testo',k:'Aggiunto come testo',p:null,cat:catKey(l.cat),custom:true,d:'Elemento importato come testo: aggiungi tu i dettagli.'}; return id; });
      const fresh = ids.filter(id => { if (where(key,id)){ dup++; return false; } return true; });
      l.coda.unshift(...fresh); S.codaOpen[key] = true;
      goTab('profilo'); push(ListScreen(key));
      later(()=>toast(`${fresh.length} importati in coda${dup?` · ${dup} già presenti`:''}`));
    }}));
  });
  return { el, render, onHero: () => false };
}

  q('#simNew',c).onchange = e => { S.newAccount = e.target.checked; refreshAll(); };

}
q('#gJump').addEventListener('click', e => { const b = e.target.closest('[data-j]'); if (!b) return; JUMPS.find(j=>j[0]===b.dataset.j)[2](); });
q('#reset').onclick = () => { S = initAdvice(fresh()); startLogin(); toast('Dati di partenza ripristinati','info'); };
const start = JUMPS.find(j => j[0]===location.hash.slice(1));
if (start) start[2](); else startLogin();
renderGuide();
